name: Update social stats

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch stats
        id: fetch
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python fetch_stats.py

      - name: Save rotated tokens
        if: always() && env.GH_PAT != '' && hashFiles('rotated_tokens.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for k in $(jq -r 'keys[]' rotated_tokens.json); do
            jq -r --arg k "$k" '.[$k]' rotated_tokens.json | gh secret set "$k" --repo "$GITHUB_REPOSITORY"
          done

      - name: Commit stats
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stats"
            git push
          fi

      - name: Flag failures
        if: steps.fetch.outcome == 'failure'
        run: exit 1
